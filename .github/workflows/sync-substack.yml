name: Sync Substack writing
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Fetch latest Substack posts
        run: python scripts/sync_substack.py
      - name: Commit updated feed when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add substack-posts.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync latest Substack posts"
            git push
          else
            echo "Substack feed is already up to date."
          fi
